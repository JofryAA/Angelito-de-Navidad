# Publica automáticamente en Firebase Hosting cada vez que se sube un cambio a la rama main.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT en GitHub (ver LEEME → "Publicar con GitHub").
name: Publicar en Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Armar app.js con las partes de Web/js/app/
        run: node tools/build-app.mjs
      - name: Marcar versión (para que los teléfonos se actualicen solos)
        run: |
          V=$(date -u +%Y.%m.%d-%H%M%S)
          sed -i -E "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$V'/" Web/js/app.js
          sed -i -E "s/const VERSION = 'angelito-[^']*'/const VERSION = 'angelito-$V'/" Web/sw.js
          sed -i -E "s#'\./juegos\.js(\?v=[^']*)?'#'./juegos.js?v=$V'#" Web/js/app.js
          sed -i -E "s#'\./panel\.js(\?v=[^']*)?'#'./panel.js?v=$V'#" Web/js/app.js
          sed -i -E "s#(css/app\.css|css/panel\.css|css/tema\.css|js/app\.js)(\?v=[^\"]*)?\"#\1?v=$V\"#g" Web/index.html
          echo "{\"version\": \"$V\"}" > Web/version.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
  # Publica también las reglas de Firestore (antes había que correr "firebase deploy --only firestore:rules" a mano).
  # Usa la misma cuenta de servicio; necesita los roles "Firebase Rules Admin" y "Service Usage Consumer".
  rules:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publicar reglas de Firestore
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14 deploy --only firestore:rules --project angelito-2026 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Publicar reglas de Realtime Database (juegos)
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14 deploy --only database --project angelito-2026 --non-interactive || echo "::warning::No se pudieron subir las reglas de Realtime Database"
          rm -f "$RUNNER_TEMP/sa.json"
