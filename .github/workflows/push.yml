name: Notificaciones (app cerrada)
on:
  schedule:
    - cron: '*/5 * * * *'   # respaldo: GitHub casi nunca lo cumple a tiempo; el disparo real lo hace cron-job.org cada minuto
  workflow_dispatch:         # botón "Run workflow" para probar a mano
    inputs:
      prueba:
        description: 'Mandar un aviso de prueba a todos los teléfonos registrados'
        type: boolean
        default: false
      ajuste:
        description: 'Hacer YA el ajuste (switch) del sorteo'
        type: boolean
        default: false
      copia:
        description: 'Hacer YA una copia de seguridad'
        type: boolean
        default: false
      restaurar:
        description: 'Restaurar la copia de esta fecha (AAAA-MM-DD). ¡Reemplaza los datos!'
        type: string
        default: ''
      colecciones:
        description: 'Solo estas colecciones, separadas por coma (vacío = todas)'
        type: string
        default: ''
      confirmar:
        description: 'Para restaurar escribe RESTAURAR'
        type: string
        default: ''
concurrency: { group: push, cancel-in-progress: false }  # nunca dos a la vez: si llega otro, espera su turno
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: push }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: push/package-lock.json }
      - run: npm ci --omit=dev --no-audit --no-fund   # con caché: arranca en pocos segundos
        working-directory: push
      - run: node send.mjs
        working-directory: push
        env:
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
          PRUEBA: ${{ inputs.prueba && '1' || '' }}
          AJUSTE: ${{ inputs.ajuste && '1' || '' }}
          COPIA: ${{ inputs.copia && '1' || '' }}
          RESTAURAR: ${{ inputs.restaurar }}
          COLECCIONES: ${{ inputs.colecciones }}
          CONFIRMAR: ${{ inputs.confirmar }}
